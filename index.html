<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionador</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      text-align: center;
      padding: 50px;
    }
    #senhaContainer, #menuContainer {
      max-width: 500px;
      margin: 0 auto;
      padding: 30px;
      background: #1e1e1e;
      border-radius: 10px;
    }
    input {
      padding: 12px;
      font-size: 18px;
      width: 80%;
      margin: 15px 0;
      border: none;
      border-radius: 5px;
    }
    button {
      padding: 12px 25px;
      font-size: 16px;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background: #0055dd; }
    .site-btn {
      display: block;
      margin: 12px auto;
      width: 90%;
      padding: 14px;
      background: #222;
      color: #0cf;
      text-decoration: none;
      border-radius: 5px;
      font-size: 16px;
    }
    .site-btn:hover { background: #333; }
    h1 { color: #0cf; }
  </style>
</head>
<body>

  <!-- Tela da Senha -->
  <div id="senhaContainer">
    <h1>🔒 Acesso Restrito</h1>
    <p>Digite a senha para continuar:</p>
    <input type="password" id="senhaInput" placeholder="Digite a senha" autocomplete="off">
    <br>
    <button onclick="verificarSenha()">Entrar</button>
    <p id="erro" style="color: red; margin-top: 10px;"></p>
  </div>

  <!-- Menu de Sites (escondido inicialmente) -->
  <div id="menuContainer" style="display: none;">
    <h1>Escolha o Site</h1>
    
    <a href="https://ubg365.org/category/arcade" target="_blank" class="site-btn">🕹️ UBG365 - Arcade</a>
    <a href="https://www.ps1fun.com/?ch=b" target="_blank" class="site-btn">🎮 PS1Fun</a>
    <a href="https://emupedia.net/beta/emuos/" target="_blank" class="site-btn">🖥️ Emupedia</a>
    <a href="https://veck.io" target="_blank" class="site-btn">🌐 Veck.io</a>
    <a href="https://gabrielnadamacho.github.io" target="_blank" class="site-btn">📂 Gabriel Nadamacho</a>
    
    <!-- Adicione mais sites aqui -->
    <!-- <a href="https://outrosite.com" target="_blank" class="site-btn">Nome do Site</a> -->
  </div>

  <script>
    function verificarSenha() {
      const senha = document.getElementById("senhaInput").value;
      const erro = document.getElementById("erro");

      if (senha === "5215") {
        document.getElementById("senhaContainer").style.display = "none";
        document.getElementById("menuContainer").style.display = "block";
      } else {
        erro.textContent = "Senha incorreta. Tente novamente.";
        document.getElementById("senhaInput").value = "";
      }
    }

    // Permite apertar Enter para confirmar a senha
    document.getElementById("senhaInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        verificarSenha();
      }
    });
  </script>

</body>
</html>
